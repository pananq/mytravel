<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyTravel｜旅行行程记录</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="home">
    <section class="home-hero">
      <p class="eyebrow">MyTravel</p>
      <h1>旅行行程记录</h1>
      <p class="lead">把已订航班、酒店、租车、门票和每天实际安排都收在一个地方。后续每次旅行都可以继续放进这个仓库。</p>
    </section>

    <section class="trip-list" aria-label="旅行列表">
      <a class="trip-card" href="trips/2026-silk-road-family/">
        <span class="trip-date">2026.08.14 - 08.20</span>
        <h2>河西走廊亲子行</h2>
        <p>深圳出发，西宁中转进，张掖、嘉峪关、敦煌，最后经北京返回深圳。</p>
        <div class="trip-meta">
          <span>7 天 6 晚</span>
          <span>3 人</span>
          <span>已订票版</span>
        </div>
      </a>
      <a class="trip-card" href="trips/2026-ganzhou/">
        <span class="trip-date">2026.05.02 - 05.04</span>
        <h2>赣州 3 日轻松游</h2>
        <p>自然风光与客家文化路线，原仓库首页已归档为独立旅行记录。</p>
        <div class="trip-meta">
          <span>3 天</span>
          <span>赣州 / 龙南</span>
          <span>历史归档</span>
        </div>
      </a>
    </section>
  </main>
</body>
</html>
